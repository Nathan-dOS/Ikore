name: CI

# Only fmt runs by itself. The other jobs cost two to four hours of hosted Windows minutes per
# run, and the free plan's monthly allowance, shared by every private repository on the account,
# covers about six such runs. They run only when dispatched by hand; see docs/testing.md.
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install # reads rust-toolchain.toml (1.98.0 + rustfmt/clippy)
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (windows)
    if: github.event_name == 'workflow_dispatch'
    needs: fmt
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Crate dependency boundaries
        shell: powershell
        run: ./scripts/check-crate-boundaries.ps1
      - name: Desktop without credential collectors
        run: cargo check --locked -p hvc-app --no-default-features --bins

  unit:
    name: unit (windows)
    if: github.event_name == 'workflow_dispatch'
    needs: fmt
    runs-on: windows-latest
    timeout-minutes: 120 # never finished in 60 on hosted runners, so the shared cache was never saved
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test-unit
      # Isolate this package: test-support otherwise enables collectors by feature unification.
      - run: cargo test --locked -p hvc-terminal --lib --no-default-features -- --test-threads=2
      - run: cargo test --locked --workspace --doc

  integration:
    name: integration (windows)
    if: github.event_name == 'workflow_dispatch'
    needs: fmt
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-test
          save-if: false # only `unit` saves the shared cache
      - run: cargo test-integration

  linux-docker:
    name: linux headless (docker)
    if: github.event_name == 'workflow_dispatch'
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true # informational until the Linux pass
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: hard-vibe-code:1.98.0
          cache-from: type=gha,scope=hvc-image
          cache-to: type=gha,scope=hvc-image,mode=max
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache
          key: docker-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: docker-cargo-
      - run: docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile ci run --rm cargo-check
      - run: docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile ci run --rm test-runner
