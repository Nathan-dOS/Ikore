name: Security

on:
  pull_request:
    paths: ["**/Cargo.toml", "Cargo.lock", "quality/distribution-policy.json"]
  push:
    branches: [main]
    paths: ["**/Cargo.toml", "Cargo.lock", "quality/distribution-policy.json"]
  schedule:
    - cron: "0 7 * * 1" # weekly, Monday
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  advisories:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit
      - run: cargo audit

  supply-chain:
    name: licenses and sources (windows graph)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fetch --locked # the script uses cargo metadata --offline
      - shell: powershell
        run: ./scripts/audit-supply-chain.ps1
