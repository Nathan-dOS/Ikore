name: Security

on:
  pull_request:
    paths: ["**/Cargo.toml", "Cargo.lock", "quality/distribution-policy.json"]
  push:
    branches: [main]
    paths: ["**/Cargo.toml", "Cargo.lock", "quality/distribution-policy.json"]
  schedule:
    - cron: "0 7 * * 1" # weekly, Monday
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  advisories:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit
      - run: cargo audit

  supply-chain:
    name: licenses and sources (windows graph)
    # The result only changes with the lockfile or the policy, so a weekly run adds nothing.
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fetch --locked # the script uses cargo metadata --offline
      - shell: powershell
        run: ./scripts/audit-supply-chain.ps1
