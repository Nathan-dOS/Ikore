# Monthly: each Dependabot push spends Actions minutes on the dependency workflows. New advisories
# are still caught by the weekly cargo audit in security.yml.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: gpui # vendored in third_party/gpui with audited patches
      - dependency-name: "tree-sitter*" # hvc-core pins the runtime and grammars with "="; bump together by hand
  # The rust Docker image moves with rust-toolchain.toml; update both by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
