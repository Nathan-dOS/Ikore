[alias]
# Local feedback by area. Complete changes with test-all and the final gate.
test-ui = "test --locked -p ikore-ui -- --test-threads=2"
test-editor = "test --locked -p ikore-editor -p ikore-ui -- --test-threads=2"
test-support = "test --locked -p ikore-test-support -p ikore-ui -- --test-threads=2"
test-contracts = "test --locked -p ikore-contracts -- --test-threads=2"
test-terminal = "test --locked -p ikore-contracts -p ikore-terminal -- --test-threads=2"
test-voice = "test --locked -p ikore-voice -- --test-threads=2"
test-core = "test --locked -p ikore-contracts -p ikore-terminal -p ikore-voice -p ikore-core -- --test-threads=2"
test-all = "test --locked --workspace -- --test-threads=2"

# CI split. test-unit + test-integration + doctests = test-all.
test-unit = "test --locked --workspace --lib --bins -- --test-threads=2"
test-integration = "test --locked --workspace --test * --example pulsation_ui_fixture -- --test-threads=2"
# Linux/Docker headless harness: crates without GPUI.
test-headless = "test --locked -p ikore-contracts -p ikore-terminal -p ikore-voice -p ikore-core -p ikore-editor -p ikore-test-support -- --test-threads=2"
