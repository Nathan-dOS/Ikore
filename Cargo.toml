[workspace]
resolver = "3"
members = [
    "crates/hvc-app",
    "crates/hvc-core",
    "crates/hvc-editor",
    "crates/hvc-test-support",
    "crates/hvc-ui",
]
default-members = ["crates/hvc-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Nathan"]
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
futures = "0.3"
gpui = { version = "0.2.2", default-features = false, features = ["windows-manifest"] }
hvc-core = { path = "crates/hvc-core" }
hvc-editor = { path = "crates/hvc-editor" }
hvc-test-support = { path = "crates/hvc-test-support" }
hvc-ui = { path = "crates/hvc-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"

[profile.dev]
incremental = true

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
# GPUI 0.2.2 vendorizado para manter o backport Windows descrito em
# third_party/gpui/HVC-PATCHES.md reproduzível e auditável.
gpui = { path = "third_party/gpui" }
