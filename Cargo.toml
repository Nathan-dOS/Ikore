[workspace]
resolver = "3"
members = [
    "crates/hvc-app",
    "crates/hvc-core",
    "crates/hvc-editor",
    "crates/hvc-ui",
    "src-tauri",
]
default-members = ["crates/hvc-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Nathan"]
license = "Proprietary"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
futures = "0.3"
gpui = { version = "0.2.2", default-features = false, features = ["windows-manifest"] }
hvc-core = { path = "crates/hvc-core" }
hvc-editor = { path = "crates/hvc-editor" }
hvc-ui = { path = "crates/hvc-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"

[profile.dev]
incremental = true

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
