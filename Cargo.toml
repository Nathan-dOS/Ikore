[workspace]
resolver = "3"
members = [
    "crates/ikore-app",
    "crates/ikore-contracts",
    "crates/ikore-core",
    "crates/ikore-editor",
    "crates/ikore-test-support",
    "crates/ikore-terminal",
    "crates/ikore-ui",
    "crates/ikore-voice",
]
default-members = ["crates/ikore-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Nathan"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
futures = "0.3"
gpui = { version = "0.2.2", default-features = false, features = ["windows-manifest"] }
ikore-contracts = { path = "crates/ikore-contracts" }
ikore-terminal = { path = "crates/ikore-terminal", default-features = false }
ikore-voice = { path = "crates/ikore-voice" }
# Members opt into the quota credential collectors through their own features (ADR-028 G10).
ikore-core = { path = "crates/ikore-core", default-features = false }
ikore-editor = { path = "crates/ikore-editor" }
ikore-test-support = { path = "crates/ikore-test-support" }
ikore-ui = { path = "crates/ikore-ui", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"

[workspace.lints.clippy]
unwrap_used = "warn"
wildcard_imports = "warn"
doc_markdown = "warn"
undocumented_unsafe_blocks = "warn"

[profile.dev]
incremental = true

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
# GPUI 0.2.2 is vendored so the Windows backport described in
# third_party/gpui/HVC-PATCHES.md stays reproducible and auditable.
# The vendored code keeps its own Apache-2.0 license.
gpui = { path = "third_party/gpui" }
