[package]
name = "hvc-test-support"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "Deterministic test harnesses for Hard Vibe Code"

[[example]]
name = "pulsation_ui_fixture"
test = true

[dependencies]
chrono.workspace = true
hvc-contracts.workspace = true
hvc-core = { workspace = true, features = ["quota-credential-collectors"] }
refinery = { version = "0.8", features = ["rusqlite"] }
rusqlite = { version = "0.33", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio.workspace = true
tokio-util.workspace = true
walkdir = "2"

[dev-dependencies]
hvc-voice.workspace = true
# The opt-in Credential Manager test of ADR-036, under a test-only service.
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
sha2 = "0.11"

[lints]
workspace = true
