[package]
name = "hvc-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Framework-agnostic domain and application core for Hard Vibe Code"

[features]
# ADR-028 G10: the plan-quota collectors that read a CLI's own access token. On in
# development; a public build can turn it off without affecting the other sources.
default = ["quota-credential-collectors"]
quota-credential-collectors = ["hvc-terminal/quota-credential-collectors"]

[dependencies]
hvc-contracts.workspace = true
hvc-terminal = { workspace = true, default-features = false }
hvc-voice.workspace = true
anyhow.workspace = true
chrono.workspace = true
fs2 = "0.4"
futures.workspace = true
globset = "0.4"
ignore = "0.4"
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }
jsonschema = "0.30"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
notify = "8"
refinery = { version = "0.8", features = ["rusqlite"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio.workspace = true
tokio-util.workspace = true
toml = "1.1.4"
tree-sitter = "=0.26.13"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
