[package]
name = "hvc-terminal"
publish = false
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CLI agent execution, durable terminal sessions and subscription quota"

[features]
default = ["quota-credential-collectors"]
quota-credential-collectors = ["dep:zeroize"]

[dependencies]
hvc-contracts.workspace = true
chrono.workspace = true
futures.workspace = true
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.33", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio.workspace = true
tokio-util.workspace = true
toml = "0.8.23"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zeroize = { version = "1.9", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[lints]
workspace = true
