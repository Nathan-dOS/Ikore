[package]
name = "ikore-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "GPUI views and native design system for Ikore"

[features]
# ADR-028 G10: off by default since 2026-11-10; see the ikore-core manifest.
default = []
quota-credential-collectors = ["ikore-core/quota-credential-collectors"]

[dependencies]
uuid = { version = "1", features = ["v4"] }
anyhow.workspace = true
chrono.workspace = true
gpui.workspace = true
ikore-contracts.workspace = true
ikore-core.workspace = true
ikore-editor.workspace = true
serde_json.workspace = true
tokio.workspace = true
# Already in the graph through gpui; names the window handle for the native caption colours.
raw-window-handle = "0.6"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
ikore-test-support.workspace = true

[lints]
workspace = true
