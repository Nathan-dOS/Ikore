[package]
name = "ikore-test-support"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "Deterministic test harnesses for Ikore"

[[example]]
name = "pulsation_ui_fixture"
test = true

[dependencies]
chrono.workspace = true
ikore-contracts.workspace = true
ikore-core = { workspace = true, features = ["quota-credential-collectors"] }
refinery = { version = "0.10", features = ["rusqlite"] }
rusqlite = { version = "0.41.0", features = ["bundled", "fallible_uint"] }
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio.workspace = true
tokio-util.workspace = true
walkdir = "2"

[dev-dependencies]
ikore-voice.workspace = true
# The opt-in Credential Manager test of ADR-036, under a test-only service.
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
sha2 = "0.11"

[lints]
workspace = true
