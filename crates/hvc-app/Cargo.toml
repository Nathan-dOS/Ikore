[package]
name = "hvc-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Native GPUI desktop application for Ikore"

[[bin]]
name = "ikore"
path = "src/main.rs"

[features]
# ADR-028 G10: off by default since 2026-11-10; see the hvc-core manifest.
default = []
quota-credential-collectors = ["hvc-ui/quota-credential-collectors"]

[dependencies]
anyhow.workspace = true
gpui.workspace = true
hvc-core.workspace = true
hvc-ui.workspace = true
tokio.workspace = true

[build-dependencies]
embed-resource = "3.0.8"

[lints]
workspace = true
