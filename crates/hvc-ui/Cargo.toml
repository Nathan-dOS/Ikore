[package]
name = "hvc-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "GPUI views and native design system for Hard Vibe Code"

[features]
default = ["quota-credential-collectors"]
quota-credential-collectors = ["hvc-core/quota-credential-collectors"]

[dependencies]
uuid = { version = "1", features = ["v4"] }
anyhow.workspace = true
chrono.workspace = true
gpui.workspace = true
hvc-core.workspace = true
hvc-editor.workspace = true
serde_json.workspace = true
tokio.workspace = true
# Already in the graph through gpui; names the window handle for the native caption colours.
raw-window-handle = "0.6"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
hvc-test-support.workspace = true

[lints]
workspace = true
