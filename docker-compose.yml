# Linux headless harness for contracts, terminal, core, editor and test-support.
# Every service is one-shot and behind a profile:
#   docker compose --profile tools build
#   docker compose --profile tools run --rm test-runner
x-hvc-base: &hvc-base
  build:
    context: .
    args:
      RUST_IMAGE: ${RUST_IMAGE:-rust:1.98.0-bookworm}
      RUST_TOOLCHAIN: ${RUST_TOOLCHAIN:-1.98.0}
  image: ikore:1.98.0
  working_dir: /workspace
  environment:
    CI: ${CI:-false}
    RUST_BACKTRACE: "1"
  volumes:
    - .:/workspace
    - cargo_registry:/usr/local/cargo/registry
    - cargo_git:/usr/local/cargo/git
    - cargo_target:/workspace/target

services:
  test-runner:
    <<: *hvc-base
    profiles: ["tools", "ci"]
    command: cargo test-headless

  cargo-check:
    <<: *hvc-base
    profiles: ["tools", "ci"]
    command: cargo check --locked -p hvc-contracts -p hvc-terminal -p hvc-core -p hvc-editor -p hvc-test-support --all-targets

  clippy-check:
    <<: *hvc-base
    profiles: ["tools", "ci"]
    command: cargo clippy --locked -p hvc-contracts -p hvc-terminal -p hvc-core -p hvc-editor -p hvc-test-support --all-targets -- -D warnings

  fmt-check:
    <<: *hvc-base
    profiles: ["tools", "ci"]
    command: cargo fmt --all -- --check

volumes:
  cargo_registry:
  cargo_git:
  cargo_target:
